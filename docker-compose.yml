services:
  benefi:
    build: .
    image: benefi:latest
    container_name: benefi
    init: true
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-80}:8080'
    environment:
      MENU_REFRESH_MINUTES: ${MENU_REFRESH_MINUTES:-15}
    volumes:
      - menu-data:/app/src/locales

volumes:
  menu-data:
